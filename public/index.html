<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP Digital Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #08090c;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 255, 136, 0.07) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 51, 75, 0.05) 0%, transparent 40%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            color: #f0f4fc;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-wrapper {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .svg-container {
            width: 100%;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 25px rgba(0, 255, 136, 0.12));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .svg-container:hover {
            transform: translateY(-4px);
            filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 35px rgba(0, 255, 136, 0.2));
        }

        .svg-container svg,
        .svg-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        .actions {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-call {
            background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
            color: #08090c;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-call:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        .btn-email {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-email:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        .btn-download {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.5);
            color: #8b9bb4;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
        }

        .btn-download:hover {
            color: #00ff88;
            border-color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="svg-container" style="max-width: 300px; margin: 0 auto;">
            <!-- Custom SCP SVG Business Card -->
            <img src="/card.svg" alt="SCP Business Card">
        </div>

        <!-- Quick Action Buttons -->
        <div class="actions">
            <a href="tel:9542265255" class="btn btn-call">
                📞 Call Me
            </a>
            <a href="mailto:koushalcharan22@gmail.com" class="btn btn-email">
                ✉️ Email Me
            </a>
            <a href="/card.svg" download="SCP-Business-Card.svg" class="btn btn-download">
                ⬇️ Download Vector SVG Card
            </a>
        </div>
    </div>
</body>
</html>
