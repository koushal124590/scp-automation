<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Silver Chrome Gradient -->
    <linearGradient id="silverBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E4E9" />
      <stop offset="50%" stop-color="#8E939D" />
      <stop offset="75%" stop-color="#D5D8E0" />
      <stop offset="100%" stop-color="#696D77" />
    </linearGradient>

    <!-- Glowing Silver / Cyan Accent Gradient -->
    <linearGradient id="silverCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filter for metallic sheen -->
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Dark Metallic Disc -->
  <circle cx="100" cy="100" r="94" fill="#0C0D10" stroke="url(#silverBase)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="#14161C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Segmented Outer Orbital Ring (6 segments) -->
  <g stroke="url(#silverCyan)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#silverGlow)">
    <circle cx="100" cy="100" r="72" stroke-dasharray="45 30" stroke-dashoffset="15" />
  </g>

  <!-- Inner Solid Silver Ring -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="url(#silverBase)" stroke-width="7" filter="url(#silverGlow)" />
  <circle cx="100" cy="100" r="38" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Tripartite Directional Arrows (0°, 120°, 240°) -->
  <g fill="url(#silverCyan)" filter="url(#silverGlow)">
    <!-- Top Arrow (0°) -->
    <g transform="translate(100, 100)">
      <path d="M 0 -48 L -7 -32 L -2 -32 L -2 -14 L 2 -14 L 2 -32 L 7 -32 Z" />
    </g>
    <!-- Bottom Right Arrow (120°) -->
    <g transform="translate(100, 100) rotate(120)">
      <path d="M 0 -48 L -7 -32 L -2 -32 L -2 -14 L 2 -32 L 7 -32 Z" />
    </g>
    <!-- Bottom Left Arrow (240°) -->
    <g transform="translate(100, 100) rotate(240)">
      <path d="M 0 -48 L -7 -32 L -2 -32 L -2 -14 L 2 -14 L 2 -32 L 7 -32 Z" />
    </g>
  </g>

  <!-- Center Core Dot -->
  <circle cx="100" cy="100" r="4" fill="#FFFFFF" filter="url(#silverGlow)" />
</svg>
